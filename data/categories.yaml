# One-line introductions shown at the top of category archives, keyed by the
# category's URL slug (/categories/<slug>/). Describe what the category covers;
# don't make claims about results. Categories without an entry simply show
# their article count.
investing: Index funds, stocks, property and the strategies behind them — how each works, what it costs and where the risks are.
market-analysis: What moves in markets, commodities and the wider economy mean for ordinary savers and investors.
cryptocurrency: Bitcoin, Ethereum and the wider crypto market — prices, regulation, tax and how to avoid the scams.
personal-finance: The everyday decisions — spending, saving, borrowing and protecting what you have.
