<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>
  {{- partial "head/head.html" . }}
</head>
<body class="kind-{{ .Kind }}{{ with .Section }} section-{{ . }}{{ end }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{- partial "icons.html" . }}
  {{- if and .IsPage (eq .Section "posts") }}<div class="progress" aria-hidden="true"></div>{{ end }}
  {{- partial "header.html" . }}
  <main id="main" tabindex="-1">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
  {{- partial "search.html" . }}
  {{- partial "scripts.html" . }}
</body>
</html>
