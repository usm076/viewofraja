# ---------------------------------------------------------------------------
# Site parameters read by the templates in layouts/.
# ---------------------------------------------------------------------------

# The publication's visible name (masthead, footer, social cards). The SEO
# site name — the <title> suffix and schema.org Organization — is still
# "Smart Personal Finance" and is set by `title` in hugo.toml and in
# layouts/_partials/seo/. Change those separately and deliberately.
brand = "Finance with Raja"
tagline = "Personal finance, explained"

# Shown as og:image for pages without their own card. Articles get a card
# generated at build time from their headline (layouts/_partials/seo/card.html).
images = ["img/social-card.png"]

# Contact address used in the footer. Taken from content/contact.md.
email = "info@financewithraja.com"

# AdSense publisher ID. Auto ads are loaded site-wide from
# layouts/_partials/head/ads.html; ads.txt in static/ must match it.
adsenseClient = "ca-pub-6151244736221984"

[sitemap]
  # Tag and category archives carry noindex (see layouts/_partials/seo/robots.html)
  # and are kept out of the sitemap too.
  excludedKinds = ["taxonomy", "term"]

[article]
  # Show the "In this article" contents box when an article has at least this
  # many second-level headings. Front matter `toc: false` hides it per article.
  tocMinHeadings = 3
  relatedLimit = 3
  sharing = ["linkedin", "x", "reddit", "facebook", "whatsapp", "telegram", "pinterest", "email"]

# ---------------------------------------------------------------------------
# Homepage composition.
#
# The lead story and the "Latest" column are always the newest articles. The
# sections below are curated from categories that already exist — a desk is
# just a set of category names, never a new taxonomy. `link` is the category
# archive a desk's "More" link points at. Articles shown higher up the page are
# not repeated lower down.
# ---------------------------------------------------------------------------
[home]
  latestCount = 5

  # "Start here": evergreen guides for readers new to the subject, by file name
  # in content/posts/ (without .md). Order is the reading order shown.
  essentials = [
    "establish-emergency-fund-guide-2025",
    "track-your-money-guide-2025",
    "debt-payoff-strategies",
    "credit-score-improvement-guide-2025",
    "high-yield-savings-accounts-2025",
    "how-interest-works-guide-2025",
    "investing-for-beginners-2025",
    "retirement-planning-guide",
  ]

  [home.markets]
    title = "Markets & the news"
    description = "What the week's economic and political headlines mean for your money."
    categories = ["Market Analysis", "Political Finance", "Economic Policy"]
    link = "/categories/market-analysis/"

  [[home.desks]]
    title = "Investing"
    categories = ["Investing", "Investment Strategies", "Wealth Building", "Stocks", "Real Estate"]
    link = "/categories/investing/"
  [[home.desks]]
    title = "Crypto"
    categories = ["Cryptocurrency", "Bitcoin", "Scam Prevention"]
    link = "/categories/cryptocurrency/"
  [[home.desks]]
    title = "Everyday money"
    categories = ["Budgeting", "Savings", "Debt Management", "Credit", "Credit Cards", "Banking", "Insurance", "Student Loans", "Education Finance"]
    link = "/categories/personal-finance/"
  [[home.desks]]
    title = "Retirement & tax"
    categories = ["Retirement Planning", "Financial Planning", "Taxes"]
    link = "/categories/retirement-planning/"

  [home.regional]
    title = "Middle East & Asia"
    description = "Banking, property and investment rules for the Gulf states and Singapore."
    categories = ["Middle East Finance", "Middle East", "Dubai", "Singapore Finance", "International Investment", "International Investing", "Emerging Markets", "International Banking", "Business Setup"]

# ---------------------------------------------------------------------------
# Author identity.
#
# Every article's schema.org author field resolves to the Person entity built
# from this block (see layouts/partials/schema.html). Before this existed, all
# 44 posts were attributed to "Finance Expert" — a person who does not exist.
#
# This is YMYL (Your Money or Your Life) content, which Google reviews against
# its strictest E-E-A-T standards. Only put verifiable facts here. An invented
# qualification is both a spam signal to Google and a risk to the AdSense
# approval this site already holds.
#
# The figures in `bio` below are true as of October 2026 and were counted
# from content/posts with Hugo's .WordCount: 53 articles, ~84,500 words,
# published since 2025-01-05. Update them as the archive grows.
# ---------------------------------------------------------------------------
[author]
  name = "Raja"

  # TODO: replace with a real role. If there is no finance job title, say what
  # is true instead — e.g. "Independent personal finance researcher".
  jobTitle = ""

  bio = "Raja writes every article on Smart Personal Finance. Since January 2025 he has published 53 long-form guides — around 85,000 words in total — covering investing, market analysis, cryptocurrency, budgeting and everyday money decisions."

  # Topics taken from the categories actually used across the 44 posts.
  knowsAbout = [
    "Personal finance",
    "Investing",
    "Market analysis",
    "Cryptocurrency",
    "Financial planning",
    "Budgeting",
    "Retirement planning",
    "Credit cards"
  ]

  # TODO: add real profile URLs. These are the strongest E-E-A-T signal you can
  # give Google, because they let it connect this author to a real identity.
  # LinkedIn matters most. Remove any you do not actually have.
  sameAs = []

  # TODO: a real photograph of Raja, placed in static/img/. Not a stock image
  # and not an illustration — Google's raters check whether authors are real.
  image = ""
