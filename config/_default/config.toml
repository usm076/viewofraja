baseURL = "https://financewithraja.com"
canonifyURLs = true
relativeURLs = false
languageCode = "en"
title = "Smart Personal Finance | Expert Tips, Reviews & Strategies"
theme = "blowfish"

enableRobotsTXT = true
[pagination]
  pagerSize = 20
summaryLength = 30

[imaging]
  resampleFilter = "CatmullRom"
  quality = 75
  anchor = "Smart"

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

# Required by Blowfish for site search: the JSON output renders /index.json,
# which assets/js/search.js fetches. Without this, the search box renders but
# finds nothing because the index returns 404.
[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  includeNewer = true
  toLower = false
    [[related.indices]]
    name = "tags"
    weight = 100
    [[related.indices]]
    name = "categories"
    weight = 100
    [[related.indices]]
    name = "series"
    weight = 50
    [[related.indices]]
    name = "authors"
    weight = 20
    [[related.indices]]
    name = "date"
    weight = 10
    pattern = "2006"